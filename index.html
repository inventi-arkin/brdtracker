<body class="bg-gray-100 font-sans antialiased text-gray-900 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Fragment } = React;

    const ICONS = {

      FileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      LayoutDashboard: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
      Users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

      ToggleLeft: '<rect width="20" height="12" x="2" y="6" rx="6" ry="6"/><circle cx="8" cy="12" r="2"/>',
      ToggleRight: '<rect width="20" height="12" x="2" y="6" rx="6" ry="6"/><circle cx="16" cy="12" r="2"/>',
      ExternalLink: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
      UserCog: '<circle cx="9" cy="7" r="4"/><path d="M10 15H6a4 4 0 0 0-4 4v2"/><circle cx="17" cy="17" r="3"/><path d="m21 17-1.9-.4"/><path d="m14.9 17.4 1.9-.4"/><path d="m18.7 15.3-1.6 1"/><path d="m16.9 19.7-1.6-1"/><path d="m18.7 18.7-1.6-1"/><path d="m16.9 14.3-1.6 1"/>',
      LogOut: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
      Lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      Filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
      RefreshCw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
      Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
      FileUp: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/>',
      BarChart2: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>'
    };

    const createIcon = (paths) => ({ size = 24, className = '', title, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {title && <title>{title}</title>}
        <g dangerouslySetInnerHTML={{ __html: paths }} />
      </svg>
    );

    const Search = createIcon(ICONS.Search); const Edit2 = createIcon(ICONS.Edit2); const Save = createIcon(ICONS.Save);
    const X = createIcon(ICONS.X); const Plus = createIcon(ICONS.Plus); const ChevronLeft = createIcon(ICONS.ChevronLeft);
    const ChevronUp = createIcon(ICONS.ChevronUp); const ChevronDown = createIcon(ICONS.ChevronDown);
    const CheckCircle = createIcon(ICONS.CheckCircle); const Clock = createIcon(ICONS.Clock); const AlertCircle = createIcon(ICONS.AlertCircle);
    const FileText = createIcon(ICONS.FileText); const LayoutDashboard = createIcon(ICONS.LayoutDashboard); const Users = createIcon(ICONS.Users);
    const Building2 = createIcon(ICONS.Building2); const Check = createIcon(ICONS.Check); const Activity = createIcon(ICONS.Activity);
    const ToggleLeft = createIcon(ICONS.ToggleLeft); const ToggleRight = createIcon(ICONS.ToggleRight); const ExternalLink = createIcon(ICONS.ExternalLink);
    const UserCog = createIcon(ICONS.UserCog); const LogOut = createIcon(ICONS.LogOut); const Lock = createIcon(ICONS.Lock);
    const Filter = createIcon(ICONS.Filter); const RefreshCw = createIcon(ICONS.RefreshCw); const Upload = createIcon(ICONS.Upload); const FileUp = createIcon(ICONS.FileUp);
    const BarChart2 = createIcon(ICONS.BarChart2);

    const STAGES = ['Backlog', 'BRD Creation', 'Team Review', 'Client Review', 'Approved', 'Go-Live', 'On-Hold', 'Terminated'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const YEARS = ['2025', '2026', '2027'];

    const INITIAL_USERS = [
      { id: '1', firstName: 'Admin', lastName: 'User', email: 'admin@brdtracker.com', password: 'password', status: 'Active', lastUpdated: '09/21/2026' }
    ];

    const calculateDays = (start, end) => {
      if (!start || !end) return '-';
      const d1 = new Date(start);
      const d2 = new Date(end);
      if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return '-';
      const diffDays = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
      return diffDays >= 0 ? `${diffDays} Days` : '-';
    };

    const checkChronologicalDates = (draft, submit, signoff) => {
      if (draft && submit && new Date(submit) < new Date(draft)) return "Date Submitted to Client cannot be earlier than Draft Date.";
      if (submit && signoff && new Date(signoff) < new Date(submit)) return "Signed-Off Date cannot be earlier than Date Submitted to Client.";
      if (draft && signoff && new Date(signoff) < new Date(draft)) return "Signed-Off Date cannot be earlier than Draft Date.";
      return '';
    };

    const isDateInPeriod = (dateStr, month, year) => {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      return MONTHS[d.getMonth()] === month && String(d.getFullYear()) === String(year);
    };

    // Firebase Database Setup
    const manualConfig = {
      apiKey: "AIzaSyCIxZrdTZEsuXpOovkYKfK6HlIIL1T6Lsk",
      authDomain: "brd-tracker.firebaseapp.com",
      projectId: "brd-tracker",
      storageBucket: "brd-tracker.firebasestorage.app",
      messagingSenderId: "686413392896",
      appId: "1:686413392896:web:6a95b0099250864ddafce5",
      measurementId: "G-4PGVCRNT92"
    };

    const firebaseConfig = manualConfig;
    const appId = 'brd-tracker-production';
    
    let fbApp = null;
    let auth = null;
    let db = null;
    if (firebaseConfig && Object.keys(firebaseConfig).length > 0 && window.FB) {
      try {
          fbApp = window.FB.initializeApp(firebaseConfig);
      } catch(e) { console.warn("Firebase initialized multiple times", e); }
      
      if (fbApp) {
          auth = window.FB.getAuth(fbApp);
          db = window.FB.getFirestore(fbApp);
      }
    }

    function Badge({ status }) {
      const styles = {
        'Backlog': 'bg-gray-100 text-gray-700 border-gray-200',
        'BRD Creation': 'bg-blue-50 text-blue-700 border-blue-200',
        'Team Review': 'bg-purple-50 text-purple-700 border-purple-200',
        'Client Review': 'bg-yellow-50 text-yellow-700 border-yellow-200',
        'Approved': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Go-Live': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'On-Hold': 'bg-orange-50 text-orange-700 border-orange-200',
        'Terminated': 'bg-red-50 text-red-700 border-red-200',
        'Active': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Inactive': 'bg-gray-100 text-gray-500 border-gray-200',
      };
      return <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${styles[status] || 'bg-gray-100 text-gray-700 border-gray-200'}`}>{status}</span>;
    }

    function Stepper({ currentStage }) {
      const activeStages = STAGES.filter(s => s !== 'Terminated' && s !== 'On-Hold');
      const currentIndex = activeStages.indexOf(currentStage);
      const isTerminated = currentStage === 'Terminated';
      const isOnHold = currentStage === 'On-Hold';

      return (
        <div className="w-full py-6 overflow-x-auto">
          <div className="flex items-center min-w-max px-4">
            {activeStages.map((stage, index) => {
              const isCompleted = index < currentIndex || (currentIndex === activeStages.length - 1 && index === currentIndex);
              const isActive = index === currentIndex;
              return (
                <div key={stage} className="flex items-center">
                  <div className="relative flex flex-col items-center">
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center border-2 transition-colors duration-300
                      ${isCompleted ? 'bg-blue-600 border-blue-600 text-white' : isActive ? 'bg-blue-50 border-blue-600 text-blue-600' : isTerminated || isOnHold ? 'bg-gray-50 border-gray-300 text-gray-400 opacity-50' : 'bg-white border-gray-300 text-gray-400'}`}>
                      {isCompleted ? <Check size={20} /> : <span className="text-sm font-semibold">{index + 1}</span>}
                    </div>
                    <div className={`absolute top-12 text-xs font-medium w-28 text-center ${isActive ? 'text-blue-700 font-bold' : isCompleted ? 'text-gray-800' : 'text-gray-400'}`}>{stage}</div>
                  </div>
                  {index < activeStages.length - 1 && <div className={`w-16 h-1 mx-2 rounded ${isCompleted ? 'bg-blue-600' : 'bg-gray-200'}`} />}
                </div>
              );
            })}
            {(isTerminated || isOnHold) && (
              <Fragment>
                <div className="w-16 h-1 mx-2 rounded bg-gray-200" />
                <div className="relative flex flex-col items-center">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center border-2 ${isTerminated ? 'bg-red-50 border-red-600 text-red-600' : 'bg-orange-50 border-orange-600 text-orange-600'}`}>
                    {isTerminated ? <AlertCircle size={20} /> : <Clock size={20} />}
                  </div>
                  <div className={`absolute top-12 text-xs font-bold w-28 text-center ${isTerminated ? 'text-red-600' : 'text-orange-600'}`}>{currentStage}</div>
                </div>
              </Fragment>
            )}
          </div>
        </div>
      );
    }

    function Dashboard({ brds, onKpiClick, onViewBrd }) {
      const kpiData = useMemo(() => {
        let docAccTotal = 0, docAccPass = 0, reworkTotal = 0, reworkCount = 0;
        let onTimeTotal = 0, onTimePass = 0, cycleTimeSum = 0, cycleTimeCount = 0;
        let stageCounts = { 'Total': 0, 'Backlog': 0, 'BRD Creation': 0, 'Team Review': 0, 'Client Review': 0, 'Approved': 0, 'Go-Live': 0, 'On-Hold': 0, 'Terminated': 0 };
        
        let docAccIds = [], reworkIds = [], onTimeIds = [];
        let stageIds = { 'Total': [], 'Backlog': [], 'BRD Creation': [], 'Team Review': [], 'Client Review': [], 'Approved': [], 'Go-Live': [], 'On-Hold': [], 'Terminated': [] };

        const activeBrds = (Array.isArray(brds) ? brds : []).filter(b => b.status !== 'Inactive');

        activeBrds.forEach(brd => {
          const hRecords = Array.isArray(brd.history) ? brd.history : [];
          const aRecords = Array.isArray(brd.activityLog) ? brd.activityLog : [];

          // Current Stage Counts
          if (stageCounts[brd.stage] !== undefined) {
            stageCounts[brd.stage]++;
            stageIds[brd.stage].push(brd.id);
          }
          stageCounts['Total']++;
          stageIds['Total'].push(brd.id);

          const getHistoricalFieldValue = (fieldName) => {
            let val = brd[fieldName]; 
            const relevantUpdates = aRecords.filter(a => a.action && a.action.includes(fieldName)).sort((a, b) => new Date(b.date) - new Date(a.date));
            if (relevantUpdates.length > 0) return relevantUpdates[0].new;
            return val;
          };

          const isDocAccEligible = brd.stage === 'Approved';
          if (isDocAccEligible) {
            docAccTotal++;
            if (getHistoricalFieldValue('changesAfterSignOff') === 'No') {
               docAccPass++;
               docAccIds.push(brd.id);
            }
          }

          const isReworkEligible = ['Team Review', 'Client Review', 'Approved'].includes(brd.stage);
          if (isReworkEligible) {
            reworkTotal++;
            if (getHistoricalFieldValue('withRework') === 'Yes') {
               reworkCount++;
               reworkIds.push(brd.id);
            }
          }

          const isOnTimeEligible = ['Client Review', 'Approved'].includes(brd.stage);
          if (isOnTimeEligible) {
            onTimeTotal++;
            if (getHistoricalFieldValue('onTime') === 'Yes') {
               onTimePass++;
               onTimeIds.push(brd.id);
            }
          }

          if (brd.stage === 'Approved' && brd.draftDate && brd.signOffDate) {
             const diffDays = Math.ceil((new Date(brd.signOffDate) - new Date(brd.draftDate)) / (1000 * 60 * 60 * 24));
             if (diffDays >= 0 && !isNaN(diffDays)) { cycleTimeSum += diffDays; cycleTimeCount++; }
          }
        });

        return {
          docAccuracy: docAccTotal > 0 ? ((docAccPass / docAccTotal) * 100).toFixed(2) : '0.00',
          reworkRate: reworkTotal > 0 ? ((reworkCount / reworkTotal) * 100).toFixed(2) : '0.00',
          onTimeRate: onTimeTotal > 0 ? ((onTimePass / onTimeTotal) * 100).toFixed(2) : '0.00',
          avgCycleDays: cycleTimeCount > 0 ? Math.round(cycleTimeSum / cycleTimeCount) : 0,
          docAccTotal, reworkTotal, onTimeTotal, cycleTimeCount, stageCounts, stageIds,
          docAccIds, reworkIds, onTimeIds
        };
      }, [brds]);

      const stats = [
        { label: 'Total BRDs', idKey: 'Total', value: kpiData.stageCounts['Total'], color: 'text-blue-600', bg: 'bg-blue-50' },
        { label: 'BRD Creation', idKey: 'BRD Creation', value: kpiData.stageCounts['BRD Creation'], color: 'text-amber-600', bg: 'bg-amber-50' },
        { label: 'Team Review', idKey: 'Team Review', value: kpiData.stageCounts['Team Review'], color: 'text-indigo-600', bg: 'bg-indigo-50' },
        { label: 'Client Review', idKey: 'Client Review', value: kpiData.stageCounts['Client Review'], color: 'text-purple-600', bg: 'bg-purple-50' },
        { label: 'Approved', idKey: 'Approved', value: kpiData.stageCounts['Approved'], color: 'text-emerald-600', bg: 'bg-emerald-50' },
        { label: 'Go-Live', idKey: 'Go-Live', value: kpiData.stageCounts['Go-Live'], color: 'text-cyan-600', bg: 'bg-cyan-50' },
        { label: 'On-Hold', idKey: 'On-Hold', value: kpiData.stageCounts['On-Hold'], color: 'text-orange-600', bg: 'bg-orange-50' },
        { label: 'Terminated', idKey: 'Terminated', value: kpiData.stageCounts['Terminated'], color: 'text-red-600', bg: 'bg-red-50' }
      ];

      const recentUpdates = Array.isArray(brds) ? [...brds].filter(b => b.status !== 'Inactive').sort((a, b) => new Date(b.lastUpdated || 0) - new Date(a.lastUpdated || 0)).slice(0, 5) : [];

      return (
        <div className="p-4 md:p-6 max-w-7xl mx-auto space-y-6 animate-in fade-in duration-500">
          <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-gray-900">Dashboard</h1>
              <p className="text-gray-500 text-sm mt-1">Overview of Active Business Requirements Documents.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col items-center text-center shadow-sm relative overflow-hidden group hover:border-emerald-300 transition-colors">
              <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div><CheckCircle className="text-emerald-500 mb-3 group-hover:scale-110 transition-transform" size={28} />
              <span className="text-4xl font-bold text-gray-900 mb-1">{kpiData.docAccTotal > 0 ? `${kpiData.docAccuracy}%` : 'N/A'}</span>
              <span className="text-xs font-semibold text-gray-600 uppercase tracking-wide mt-1">Document Accuracy</span>
              <span className="text-[10px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded">Based on {kpiData.docAccTotal} Approved BRDs</span>
            </div>
            <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col items-center text-center shadow-sm relative overflow-hidden group hover:border-amber-300 transition-colors">
              <div className="absolute top-0 left-0 w-full h-1 bg-amber-500"></div><AlertCircle className="text-amber-500 mb-3 group-hover:scale-110 transition-transform" size={28} />
              <span className="text-4xl font-bold text-gray-900 mb-1">{kpiData.reworkTotal > 0 ? `${kpiData.reworkRate}%` : 'N/A'}</span>
              <span className="text-xs font-semibold text-gray-600 uppercase tracking-wide mt-1">Rework Rate</span>
              <span className="text-[10px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded">Based on {kpiData.reworkTotal} Active Reviews</span>
            </div>
            <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col items-center text-center shadow-sm relative overflow-hidden group hover:border-blue-300 transition-colors">
              <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div><Clock className="text-blue-500 mb-3 group-hover:scale-110 transition-transform" size={28} />
              <span className="text-4xl font-bold text-gray-900 mb-1">{kpiData.onTimeTotal > 0 ? `${kpiData.onTimeRate}%` : 'N/A'}</span>
              <span className="text-xs font-semibold text-gray-600 uppercase tracking-wide mt-1">On-Time Deliverables</span>
              <span className="text-[10px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded">Based on {kpiData.onTimeTotal} Client Reviews</span>
            </div>
            <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col items-center text-center shadow-sm relative overflow-hidden group hover:border-purple-300 transition-colors">
              <div className="absolute top-0 left-0 w-full h-1 bg-purple-500"></div><Activity className="text-purple-500 mb-3 group-hover:scale-110 transition-transform" size={28} />
              <span className="text-4xl font-bold text-gray-900 mb-1">{kpiData.cycleTimeCount > 0 ? <Fragment><span className="flex items-baseline justify-center gap-1">{kpiData.avgCycleDays} <span className="text-lg text-gray-500 font-medium">Days</span></span></Fragment> : 'N/A'}</span>
              <span className="text-xs font-semibold text-gray-600 uppercase tracking-wide mt-1">Avg End-to-End Cycle</span>
              <span className="text-[10px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded">Based on {kpiData.cycleTimeCount} Approved BRDs</span>
            </div>
          </div>
          
          <div>
            <h3 className="text-lg font-semibold text-gray-900 mb-4 flex items-center"><Activity className="mr-2 text-gray-400" size={20}/> Stage Summary</h3>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              {stats.map(stat => (
                <div key={stat.label} onClick={() => onKpiClick && onKpiClick(`Stage: ${stat.label}`, kpiData.stageIds[stat.idKey])} className="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md transition-shadow group cursor-pointer">
                  <span className="text-sm font-medium text-gray-500 group-hover:text-blue-600 transition-colors">{stat.label}</span>
                  <div className="flex items-end justify-between mt-2"><span className={`text-3xl font-bold ${stat.color}`}>{String(stat.value)}</span><div className={`p-2 rounded-lg ${stat.bg}`}><Activity size={20} className={stat.color} /></div></div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col">
            <h3 className="text-lg font-semibold text-gray-900 mb-6 flex items-center"><Clock className="mr-2 text-gray-400" size={20}/> Recently Updated Active BRDs</h3>
            <div className="flex-1 overflow-y-auto pr-2">
              <div className="space-y-4">
                {recentUpdates.map(brd => {
                  const lastUser = brd.activityLog?.[0]?.user || brd.history?.[0]?.by || 'System User';
                  return (
                    <div key={brd.id} onClick={() => onViewBrd && onViewBrd(brd)} className="flex items-start p-4 bg-gray-50 rounded-lg border border-gray-200 hover:bg-blue-50/50 hover:border-blue-200 transition-colors cursor-pointer">
                      <div className="p-2 bg-white rounded-md border border-gray-200 mr-4 shrink-0 mt-0.5 shadow-sm"><FileText size={16} className="text-blue-600"/></div>
                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-start gap-4">
                          <div className="text-sm font-bold text-gray-900 truncate" title={brd.title}>{brd.title}</div>
                          <div className="shrink-0 text-sm font-medium text-gray-600">{brd.stage}</div>

    }

    function BrdList({ brds, onView, onAdd, onToggleStatus, accounts, bas, kpiFilter, onClearKpiFilter, onBackToDashboard }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStage, setFilterStage] = useState('All Stages');
      const [filterAccount, setFilterAccount] = useState('All Accounts');
      const [filterBa, setFilterBa] = useState('All BAs');
      const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'desc' });
      const [currentPage, setCurrentPage] = useState(1);

      const ITEMS_PER_PAGE = 20;

      useEffect(() => {
        setCurrentPage(1);
      }, [searchTerm, filterStage, filterAccount, filterBa, kpiFilter]);

      const safeBrds = Array.isArray(brds) ? brds : [];
      const filteredBrds = safeBrds.filter(brd => {
        if (kpiFilter && kpiFilter.ids) {
          return kpiFilter.ids.includes(brd.id);
        }
        const matchesSearch = (brd.title || '').toLowerCase().includes(searchTerm.toLowerCase()) || String(brd.id || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchesStage = filterStage === 'All Stages' || brd.stage === filterStage;
        const matchesAccount = filterAccount === 'All Accounts' || brd.community === filterAccount;
        const matchesBa = filterBa === 'All BAs' || brd.ba === filterBa;
        return matchesSearch && matchesStage && matchesAccount && matchesBa;
      });

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };

      const sortedBrds = [...filteredBrds].sort((a, b) => {
        if (!a[sortConfig.key]) return 1;
        if (!b[sortConfig.key]) return -1;
        
        let valA = a[sortConfig.key].toString().toLowerCase();
        let valB = b[sortConfig.key].toString().toLowerCase();

        if (sortConfig.key === 'id') {
            valA = parseInt(valA.replace(/\D/g, ''), 10) || 0;
            valB = parseInt(valB.replace(/\D/g, ''), 10) || 0;
        }

        if (sortConfig.key === 'lastUpdated') {
            valA = new Date(a[sortConfig.key]).getTime() || 0;
            valB = new Date(b[sortConfig.key]).getTime() || 0;
        }

        if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
        if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });

      const totalPages = Math.ceil(sortedBrds.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const currentBrds = sortedBrds.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      const getPageNumbers = () => {
        let start = Math.max(1, currentPage - 2);
        let end = Math.min(totalPages, start + 4);
        if (end - start < 4) {
            start = Math.max(1, end - 4);
        }
        return Array.from({ length: end - start + 1 }, (_, i) => start + i);
      };

      const SortIcon = ({ column }) => {
        if (sortConfig.key !== column) return <span className="text-gray-300 ml-1 opacity-0 group-hover:opacity-50 transition-opacity inline-block"><ChevronDown size={14}/></span>;
        return sortConfig.direction === 'asc' ? <span className="inline-block"><ChevronUp size={14} className="ml-1 text-blue-600"/></span> : <span className="inline-block"><ChevronDown size={14} className="ml-1 text-blue-600"/></span>;
      };

      const Th = ({ label, column, className = "" }) => (
        <th className={`px-4 py-3 font-medium cursor-pointer group hover:bg-gray-100 transition-colors select-none ${className}`} onClick={() => handleSort(column)}>
            <div className="flex items-center">
                {label}
                <SortIcon column={column} />
            </div>
        </th>
      );

      return (
        <div className="p-4 md:p-6 max-w-7xl mx-auto space-y-6 animate-in fade-in duration-500">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              {kpiFilter && onBackToDashboard && (
                <div onClick={onBackToDashboard} className="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-800 cursor-pointer mb-2 transition-colors">
                  <ChevronLeft size={16} className="mr-1" /> Back to Dashboard
                </div>
              )}
              <h1 className="text-2xl font-bold text-gray-900">BRD Repository</h1>
              <p className="text-gray-500 text-sm mt-1">Manage and track all Business Requirements Documents.</p>
            </div>
            <div className="flex gap-3">
              <button onClick={onAdd} className="flex items-center bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors whitespace-nowrap shadow-sm"><Plus size={16} className="mr-2"/> New BRD</button>
            </div>
          </div>

          {kpiFilter && (
            <div className="bg-blue-50 border border-blue-200 text-blue-800 p-4 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
              <div className="flex items-center gap-3">
                <Filter className="text-blue-500" size={20}/>
                <div>
                  <div className="font-bold text-sm">Filter Active</div>
                  <div className="text-sm mt-0.5">Showing BRDs associated with: <span className="font-semibold">{kpiFilter.title}</span></div>
                </div>
              </div>
              <button onClick={onClearKpiFilter} className="text-sm bg-white border border-blue-200 px-4 py-2 rounded-lg hover:bg-blue-100 font-medium transition-colors whitespace-nowrap shadow-sm flex items-center"><X size={14} className="mr-1.5"/> Clear Filter</button>
            </div>
          )}

          {!kpiFilter && (
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col lg:flex-row gap-4">
              <div className="relative flex-1"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} /><input type="text" placeholder="Search by ID or Title..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div>
              <div className="flex flex-col md:flex-row gap-4">
                <select value={filterStage} onChange={e => setFilterStage(e.target.value)} className="w-full md:w-48 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer"><option value="All Stages">All Stages</option>{STAGES.map(s => <option key={s} value={s}>{s}</option>)}</select>
                <select value={filterAccount} onChange={e => setFilterAccount(e.target.value)} className="w-full md:w-48 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer"><option value="All Accounts">All Accounts</option>{(Array.isArray(accounts) ? accounts : []).map(a => <option key={a.id} value={a.name}>{a.name}</option>)}</select>
                <select value={filterBa} onChange={e => setFilterBa(e.target.value)} className="w-full md:w-48 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer"><option value="All BAs">All BAs</option>{(Array.isArray(bas) ? bas : []).map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</select>
              </div>
            </div>
          )}

          <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-gray-50 text-gray-600 border-b border-gray-200">
                  <tr>
                    <Th label="ID" column="id" />
                    <Th label="Title" column="title" />
                    <Th label="Account" column="community" />
                    <Th label="BA" column="ba" />
                    <Th label="Stage" column="stage" />
                    <Th label="Status" column="status" />
                    <Th label="Last Updated" column="lastUpdated" />
                    <th className="px-4 py-3 font-medium text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {currentBrds.map(brd => {
                    const isInactive = brd.status === 'Inactive';
                    return (
                      <tr key={brd.id} onClick={() => onView(brd)} className={`hover:bg-blue-50/50 cursor-pointer transition-colors group ${isInactive ? 'bg-gray-50' : ''}`}>
                        <td className={`px-4 py-3 font-medium ${isInactive ? 'text-gray-400' : 'text-blue-600 group-hover:text-blue-700'}`}>{brd.id}</td>
                        <td className={`px-4 py-3 font-medium ${isInactive ? 'text-gray-400' : 'text-gray-900'}`}>{brd.title}</td>
                        <td className={`px-4 py-3 ${isInactive ? 'text-gray-400' : 'text-gray-600'}`}>{brd.community}</td>
                        <td className={`px-4 py-3 ${isInactive ? 'text-gray-400' : 'text-gray-600'}`}>{brd.ba}</td>
                        <td className="px-4 py-3"><Badge status={brd.stage} /></td>
                        <td className="px-4 py-3"><Badge status={brd.status || 'Active'} /></td>
                        <td className={`px-4 py-3 ${isInactive ? 'text-gray-400' : 'text-gray-500'}`}>{brd.lastUpdated ? String(brd.lastUpdated).split(',')[0] : '-'}</td>
                        <td className="px-4 py-3 text-right space-x-3" onClick={(e) => e.stopPropagation()}>
                          <button onClick={() => onToggleStatus(brd)} className="font-medium inline-flex items-center justify-center p-1 rounded transition-colors align-middle" title={(brd.status || 'Active') === 'Active' ? 'Deactivate' : 'Activate'}>
                            {(brd.status || 'Active') === 'Active' ? <ToggleRight size={24} className="text-emerald-600 hover:text-emerald-800" /> : <ToggleLeft size={24} className="text-gray-400 hover:text-gray-600" />}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {currentBrds.length === 0 && <tr><td colSpan="8" className="px-4 py-8 text-center text-gray-500">No records found matching your filters.</td></tr>}
                </tbody>
              </table>
            </div>
            
            {totalPages > 1 && (
              <div className="flex flex-col sm:flex-row items-center justify-between px-4 py-3 bg-gray-50 border-t border-gray-200 sm:px-6 gap-4">
                <div className="text-sm text-gray-700 text-center sm:text-left">
                  Showing <span className="font-medium">{startIndex + 1}</span> to <span className="font-medium">{Math.min(startIndex + ITEMS_PER_PAGE, sortedBrds.length)}</span> of <span className="font-medium">{sortedBrds.length}</span> results
                </div>
                <div className="flex items-center space-x-2">
                  <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="inline-flex items-center px-3 py-1.5 rounded border border-gray-300 bg-white text-sm font-medium text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                    <ChevronLeft size={16} className="mr-1" /> Prev
                  </button>
                  <div className="hidden sm:flex space-x-1">
                    {getPageNumbers().map(page => (
                      <button key={page} onClick={() => setCurrentPage(page)} className={`px-3 py-1.5 border rounded text-sm font-medium transition-colors ${currentPage === page ? 'bg-blue-600 border-blue-600 text-white shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                        {page}
                      </button>
                    ))}
                  </div>
                  <div className="sm:hidden text-sm font-medium text-gray-700 bg-white border border-gray-300 px-3 py-1.5 rounded">
                    Page {currentPage} of {totalPages}
                  </div>
                  <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="inline-flex items-center px-3 py-1.5 rounded border border-gray-300 bg-white text-sm font-medium text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                    Next <ChevronLeft size={16} className="ml-1 rotate-180" />
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReportsModule({ brds, onViewBrd, filterMonth, setFilterMonth, filterYear, setFilterYear }) {
      const kpiTrends = useMemo(() => {
        const trends = [];
        let currMonthIdx = MONTHS.indexOf(filterMonth);
        let currYear = parseInt(filterYear, 10);

        for (let i = 0; i < 6; i++) {
          let mIdx = currMonthIdx - i;
          let y = currYear;
          if (mIdx < 0) { mIdx += 12; y -= 1; }
          const mName = MONTHS[mIdx];
          
          let docAccTotal = 0, docAccPass = 0, reworkTotal = 0, reworkCount = 0;
          let onTimeTotal = 0, onTimePass = 0, cycleSum = 0, cycleCount = 0;

          (Array.isArray(brds) ? brds : []).filter(b => b.status !== 'Inactive').forEach(brd => {
            const hRecords = brd.history || [];
            
            const reachedApproved = hRecords.some(h => h.to === 'Approved' && isDateInPeriod(h.date, mName, y));
            if (reachedApproved) {
              docAccTotal++;
              if (brd.changesAfterSignOff === 'No') docAccPass++;
              if (brd.draftDate && brd.signOffDate) {
                const diff = Math.ceil((new Date(brd.signOffDate) - new Date(brd.draftDate)) / (1000 * 60 * 60 * 24));
                if (diff >= 0 && !isNaN(diff)) { cycleSum += diff; cycleCount++; }
              }
            }

            const reachedReview = hRecords.some(h => ['Team Review', 'Client Review', 'Approved'].includes(h.to) && isDateInPeriod(h.date, mName, y));
            if (reachedReview) {
              reworkTotal++;
              if (brd.withRework === 'Yes') reworkCount++;
            }

            const reachedClient = hRecords.some(h => ['Client Review', 'Approved'].includes(h.to) && isDateInPeriod(h.date, mName, y));
            if (reachedClient) {
              onTimeTotal++;
              if (brd.onTime === 'Yes') onTimePass++;
            }
          });

          trends.push({
            period: `${mName} ${y}`,
            docAccuracy: docAccTotal > 0 ? ((docAccPass / docAccTotal) * 100).toFixed(2) : '0.00',
            reworkRate: reworkTotal > 0 ? ((reworkCount / reworkTotal) * 100).toFixed(2) : '0.00',
            onTimeRate: onTimeTotal > 0 ? ((onTimePass / onTimeTotal) * 100).toFixed(2) : '0.00',
            avgCycle: cycleCount > 0 ? Math.round(cycleSum / cycleCount) : 0,
            docAccTotal, reworkTotal, onTimeTotal, cycleCount
          });
        }
        return trends;
      }, [brds, filterMonth, filterYear]);

      const currentKpi = kpiTrends[0];

      const activityBrds = useMemo(() => {
        return (Array.isArray(brds) ? brds : []).reduce((acc, brd) => {
          if (brd.status === 'Inactive') return acc;
          let inPeriod = false, prevStage = brd.stage, currStage = brd.stage, periodUpdated = brd.lastUpdated;

          const hRecords = Array.isArray(brd.history) ? brd.history : [];
          const aRecords = Array.isArray(brd.activityLog) ? brd.activityLog : [];

          const historyInPeriod = hRecords.filter(h => isDateInPeriod(h.date, filterMonth, filterYear) && h.from !== 'System Import').sort((a, b) => new Date(b.date) - new Date(a.date));
          const activityInPeriod = aRecords.filter(a => isDateInPeriod(a.date, filterMonth, filterYear) && a.action !== 'Record Imported').sort((a, b) => new Date(b.date) - new Date(a.date));
          
          if (historyInPeriod.length > 0) {
              inPeriod = true; currStage = historyInPeriod[0].to; prevStage = historyInPeriod[historyInPeriod.length - 1].from; periodUpdated = historyInPeriod[0].date;
          } else if (activityInPeriod.length > 0) {
              inPeriod = true; periodUpdated = activityInPeriod[0].date;
              const earlierHistory = hRecords.filter(h => new Date(h.date) < new Date(`${filterMonth} 1, ${filterYear}`) && h.from !== 'System Import').sort((a,b) => new Date(b.date) - new Date(a.date));
              if(earlierHistory.length > 0) { prevStage = earlierHistory[0].to; currStage = earlierHistory[0].to; }
          }

          if (inPeriod) acc.push({ ...brd, reportPrevStage: prevStage, reportCurrStage: currStage, reportLastUpdated: periodUpdated });
          return acc;
        }, []).sort((a, b) => new Date(b.reportLastUpdated || 0) - new Date(a.reportLastUpdated || 0));
      }, [brds, filterMonth, filterYear]);

      return (
        <div className="p-4 md:p-6 max-w-7xl mx-auto space-y-8 animate-in fade-in duration-500 pb-12">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <div><h1 className="text-2xl font-bold text-gray-900">Reports & Analytics</h1><p className="text-gray-500 text-sm mt-1">Review performance metrics and BRD activity.</p></div>
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 text-gray-700 font-medium"><Filter size={18} className="text-blue-600"/><span>Report Period:</span></div>
              <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 shadow-sm cursor-pointer">{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <select value={filterYear} onChange={e => setFilterYear(e.target.value)} className="p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 shadow-sm cursor-pointer">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
            </div>
          </div>

          <div className="space-y-6">
            <div>
              <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center"><BarChart2 className="mr-2 text-blue-600" size={20}/> KPI Performance ({filterMonth} {filterYear})</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col shadow-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div><span className="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2 flex items-center"><CheckCircle size={16} className="text-emerald-500 mr-1.5"/> Doc Accuracy</span>
                  <span className="text-3xl font-bold text-gray-900">{currentKpi.docAccTotal > 0 ? `${currentKpi.docAccuracy}%` : 'N/A'}</span>
                  <span className="text-[11px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded inline-block w-max">Based on {currentKpi.docAccTotal} Approved</span>
                </div>
                <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col shadow-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-amber-500"></div><span className="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2 flex items-center"><AlertCircle size={16} className="text-amber-500 mr-1.5"/> Rework Rate</span>
                  <span className="text-3xl font-bold text-gray-900">{currentKpi.reworkTotal > 0 ? `${currentKpi.reworkRate}%` : 'N/A'}</span>
                  <span className="text-[11px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded inline-block w-max">Based on {currentKpi.reworkTotal} Reviews</span>
                </div>
                <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col shadow-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div><span className="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2 flex items-center"><Clock size={16} className="text-blue-500 mr-1.5"/> On-Time Rate</span>
                  <span className="text-3xl font-bold text-gray-900">{currentKpi.onTimeTotal > 0 ? `${currentKpi.onTimeRate}%` : 'N/A'}</span>
                  <span className="text-[11px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded inline-block w-max">Based on {currentKpi.onTimeTotal} Deliveries</span>
                </div>
                <div className="bg-white rounded-xl p-5 border border-gray-200 flex flex-col shadow-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-purple-500"></div><span className="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2 flex items-center"><Activity size={16} className="text-purple-500 mr-1.5"/> Avg Cycle Time</span>
                  <span className="text-3xl font-bold text-gray-900">{currentKpi.cycleCount > 0 ? <Fragment><span className="flex items-baseline gap-1">{currentKpi.avgCycle} <span className="text-lg text-gray-500 font-medium">Days</span></span></Fragment> : 'N/A'}</span>
                  <span className="text-[11px] text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded inline-block w-max">Based on {currentKpi.cycleCount} Approvals</span>
                </div>
              </div>
            </div>
            
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="px-5 py-4 border-b border-gray-200 bg-gray-50/50"><h3 className="text-sm font-bold text-gray-900 flex items-center uppercase tracking-wider text-gray-500"><Activity className="mr-2 text-blue-600" size={18}/> BRD Activity Report</h3></div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-white border-b border-gray-200 text-gray-500"><tr><th className="px-5 py-3 font-semibold">BRD ID & Title</th><th className="px-5 py-3 font-semibold">Account</th><th className="px-5 py-3 font-semibold">Previous Stage</th><th className="px-5 py-3 font-semibold">Current Stage</th><th className="px-5 py-3 font-semibold">Last Updated</th></tr></thead>
                  <tbody className="divide-y divide-gray-100">
                    {activityBrds.map(brd => (
                      <tr key={brd.id} onClick={() => onViewBrd && onViewBrd(brd)} className="hover:bg-blue-50/50 transition-colors cursor-pointer group">
                        <td className="px-5 py-3"><div className="font-bold text-blue-600 group-hover:text-blue-800">{brd.id}</div><div className="text-xs text-gray-600 mt-0.5 truncate max-w-[250px]" title={brd.title}>{brd.title}</div></td><td className="px-5 py-3 text-gray-700 font-medium">{brd.community}</td><td className="px-5 py-3"><Badge status={brd.reportPrevStage} /></td>
                        <td className="px-5 py-3 flex items-center gap-2 mt-2">{brd.reportPrevStage !== brd.reportCurrStage && <ChevronLeft size={14} className="text-gray-400 rotate-180" />}<Badge status={brd.reportCurrStage} /></td><td className="px-5 py-3 text-gray-500">{String(brd.reportLastUpdated).split(',')[0]}</td>
                      </tr>
                    ))}
                    {activityBrds.length === 0 && <tr><td colSpan="5" className="px-5 py-10 text-center text-gray-500">No BRD activity recorded for {filterMonth} {filterYear}.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BrdDetail({ brd, backLabel, onBack, onUpdate, accounts, bas, currentUser }) {
      const [isEditing, setIsEditing] = useState(false);
      const [formData, setFormData] = useState({ ...brd });
      const [activeTab, setActiveTab] = useState('stage');
      const [validationError, setValidationError] = useState('');
      const [toast, setToast] = useState('');
      
      const [showStageModal, setShowStageModal] = useState(false);
      const [pendingStage, setPendingStage] = useState(brd.stage);
      const [stageRemarks, setStageRemarks] = useState('');
      const [missingFields, setMissingFields] = useState([]);
      const [modalFormData, setModalFormData] = useState({});
      const [modalError, setModalError] = useState('');

      useEffect(() => { setFormData(brd); setValidationError(''); }, [brd, isEditing]);
      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

      const getMissingRequiredFields = (targetStage, currentData) => {
        if (targetStage === 'Terminated' || targetStage === 'On-Hold') return [];
        const activeStagesList = STAGES.filter(s => s !== 'Terminated' && s !== 'On-Hold');
        const targetIdx = activeStagesList.indexOf(targetStage);
        const missing = [];
        if (targetIdx >= activeStagesList.indexOf('BRD Creation') && !currentData.draftDate) missing.push({ id: 'draftDate', label: 'Draft Date', type: 'date' });
        if (targetIdx >= activeStagesList.indexOf('Team Review') && !currentData.withRework) missing.push({ id: 'withRework', label: 'WITH REWORK?', type: 'radio' });
        if (targetIdx >= activeStagesList.indexOf('Client Review')) {
          if (!currentData.clientSubmitDate) missing.push({ id: 'clientSubmitDate', label: 'Date Submitted to Client', type: 'date' });
          if (!currentData.onTime) missing.push({ id: 'onTime', label: 'DELIVERED ON-TIME?', type: 'radio' });
        }
        if (targetIdx >= activeStagesList.indexOf('Approved')) {
          if (!currentData.signOffDate) missing.push({ id: 'signOffDate', label: 'Signed-Off Date', type: 'date' });
          if (!currentData.changesAfterSignOff) missing.push({ id: 'changesAfterSignOff', label: 'CHANGES AFTER SIGN-OFF?', type: 'radio' });
        }
        return missing;
      };

      const handleSave = () => {
        if (!formData.title || !formData.description || !formData.community || !formData.ba || !formData.classification || !formData.isStandard) {
          setValidationError('Please fill in all general required fields marked with an asterisk (*).'); return;
        }
        
        const isTerminatedOrHold = formData.stage === 'Terminated' || formData.stage === 'On-Hold';
        if (!isTerminatedOrHold) {
          const activeStagesList = STAGES.filter(s => s !== 'Terminated' && s !== 'On-Hold');
          const targetIdx = activeStagesList.indexOf(formData.stage);
          if (targetIdx >= activeStagesList.indexOf('Team Review') && !formData.withRework) { setValidationError('WITH REWORK? is required for the current stage.'); return; }
          if (targetIdx >= activeStagesList.indexOf('Client Review') && !formData.onTime) { setValidationError('DELIVERED ON-TIME? is required for the current stage.'); return; }
          if (targetIdx >= activeStagesList.indexOf('Approved') && !formData.changesAfterSignOff) { setValidationError('CHANGES AFTER SIGN-OFF? is required for the current stage.'); return; }
          const missing = getMissingRequiredFields(formData.stage, formData);
          if (missing.length > 0) { setValidationError(`The following fields are required for the ${formData.stage} stage: ${missing.map(f => f.label).join(', ')}`); return; }
          const dateError = checkChronologicalDates(formData.draftDate, formData.clientSubmitDate, formData.signOffDate);
          if (dateError) { setValidationError(dateError); return; }
        }

        setValidationError('');
        let newActivities = [...(brd.activityLog || [])];
        const timestamp = new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
        const userName = currentUser ? `${currentUser.firstName} ${currentUser.lastName}` : 'System User';
        
        const fieldsToTrack = ['draftDate', 'clientSubmitDate', 'signOffDate', 'withRework', 'changesAfterSignOff', 'onTime', 'description', 'community', 'ba', 'classification', 'isStandard', 'documentLink', 'title'];
        fieldsToTrack.forEach(field => {
          if (brd[field] !== formData[field]) {
            newActivities.unshift({ id: String(Date.now() + Math.random()), date: timestamp, user: userName, action: `${field} updated`, prev: brd[field] || '-', new: formData[field] || '-' });
          }
        });

        onUpdate({ ...formData, lastUpdated: timestamp, activityLog: newActivities });
        setIsEditing(false);
        showToast('BRD record updated successfully.');
      };

      const handleStageChangeRequest = (e) => {
        const newStage = e.target.value;
        if (newStage !== brd.stage) {
          const requiredMissing = getMissingRequiredFields(newStage, formData);
          setMissingFields(requiredMissing);
          const initialModalData = {};
          requiredMissing.forEach(field => { initialModalData[field.id] = ''; });
          setModalFormData(initialModalData);
          setPendingStage(newStage); setModalError(''); setShowStageModal(true);
        }
      };

      const confirmStageChange = () => {
        for (let field of missingFields) { if (!modalFormData[field.id]) { setModalError(`Please provide a value for ${field.label}.`); return; } }
        const combinedData = { ...formData, ...modalFormData };
        if (pendingStage !== 'Terminated' && pendingStage !== 'On-Hold') {
          const dateError = checkChronologicalDates(combinedData.draftDate, combinedData.clientSubmitDate, combinedData.signOffDate);
          if (dateError) { setModalError(dateError); return; }
        }
        
        setModalError('');
        const timestamp = new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
        const userName = currentUser ? `${currentUser.firstName} ${currentUser.lastName}` : 'System User';
        const newHistoryEntry = { id: String(Date.now()), date: timestamp, from: brd.stage, to: pendingStage, by: userName, remarks: stageRemarks || 'No remarks' };
        const newActivities = [{ id: String(Date.now() + 1), date: timestamp, user: userName, action: 'Stage changed', prev: brd.stage, new: pendingStage }];

        missingFields.forEach((field, index) => {
          newActivities.push({ id: String(Date.now() + 2 + index), date: timestamp, user: userName, action: `${field.id} updated`, prev: '-', new: modalFormData[field.id] });
        });

        onUpdate({ ...combinedData, stage: pendingStage, lastUpdated: timestamp, history: [newHistoryEntry, ...(brd.history || [])], activityLog: [...newActivities, ...(brd.activityLog || [])] });
        setShowStageModal(false); setStageRemarks(''); showToast(`Stage successfully changed to ${pendingStage}.`);
      };

      const renderLabel = (text, isReq = false) => <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">{text} {(isEditing && isReq) && <span className="text-red-500">*</span>}</label>;

      const activeStages = STAGES.filter(s => s !== 'Terminated' && s !== 'On-Hold');
      const currentStageIdx = activeStages.includes(formData.stage) ? activeStages.indexOf(formData.stage) : -1;
      const isTerminatedOrHold = formData.stage === 'Terminated' || formData.stage === 'On-Hold';
      
      const isDraftReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('BRD Creation');
      const isReworkReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('Team Review');
      const isClientReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('Client Review');
      const isOnTimeReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('Client Review');
      const isSignReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('Approved');
      const isChangesReq = !isTerminatedOrHold && currentStageIdx >= activeStages.indexOf('Approved');

      return (
        <div className="p-4 md:p-6 max-w-5xl mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
          {toast && <div className="fixed top-6 right-6 bg-emerald-600 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 z-50"><CheckCircle size={18} /> {toast}</div>}
          <button onClick={onBack} className="flex items-center text-sm text-gray-500 hover:text-blue-600 transition-colors"><ChevronLeft size={16} className="mr-1" /> {backLabel || 'Back to List'}</button>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-6">
              <div className="flex-1 mr-4">
                <div className="flex items-center gap-3 mb-1">
                  <h1 className="text-2xl font-bold text-gray-900">ID: {brd.id}</h1>
                  <Badge status={brd.stage} />
                  {brd.status === 'Inactive' && <Badge status="Inactive" />}
                </div>
                {isEditing ? (
                  <input type="text" className="w-full max-w-lg mt-2 p-2 border border-gray-300 rounded-md text-lg font-medium outline-none focus:border-blue-500" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="BRD Title" />
                ) : <p className="text-gray-600 font-medium text-lg">{brd.title}</p>}
                <p className="text-xs text-gray-400 mt-2">Last Updated: {brd.lastUpdated}</p>
              </div>
              <div className="bg-gray-50 border border-gray-200 p-3 rounded-lg w-full md:w-auto md:min-w-[200px]">
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Update Stage</label>
                <select className="w-full bg-white border border-gray-300 rounded p-1.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer" value={formData.stage} onChange={handleStageChangeRequest} disabled={isEditing || brd.status === 'Inactive'}>
                  {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            <Stepper currentStage={formData.stage} />
          </div>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
            <div className="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
              <h2 className="text-lg font-semibold text-gray-900 flex items-center gap-2"><FileText size={18} className="text-blue-600"/> Record Information</h2>
              {!isEditing ? (
                <button onClick={() => setIsEditing(true)} disabled={brd.status === 'Inactive'} className={`flex items-center text-sm font-medium px-3 py-1.5 rounded-md transition-colors ${brd.status === 'Inactive' ? 'text-gray-400 bg-gray-50 cursor-not-allowed' : 'text-blue-600 hover:text-blue-800 bg-blue-50'}`}>
                  <Edit2 size={14} className="mr-1.5"/> Edit Details
                </button>
              ) : (
                <div className="flex gap-2">
                  <button onClick={() => setIsEditing(false)} className="text-sm font-medium text-gray-600 hover:text-gray-800 px-3 py-1.5 rounded-md transition-colors">Cancel</button>
                  <button onClick={handleSave} className="flex items-center text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-md transition-colors shadow-sm"><Save size={14} className="mr-1.5"/> Save Changes</button>
                </div>
              )}
            </div>

            {validationError && <div className="mb-6 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center"><AlertCircle size={16} className="mr-2 shrink-0" /> {validationError}</div>}

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-6">
              <div className="space-y-1 col-span-1 md:col-span-2 lg:col-span-3">
                {renderLabel("Description", true)}
                {isEditing ? <textarea className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500 bg-white resize-y" rows="3" placeholder="Enter BRD description..." value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} /> : <div className="text-sm font-medium text-gray-900 whitespace-pre-wrap">{brd.description}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Account", true)}
                {isEditing ? <select className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500 bg-white" value={formData.community} onChange={e => setFormData({...formData, community: e.target.value})}><option value="">Select Account...</option>{(Array.isArray(accounts) ? accounts : []).filter(a => a.status === 'Active' || a.name === brd.community).map(a => <option key={a.id} value={a.name}>{a.name}</option>)}</select> : <div className="text-sm font-medium text-gray-900">{brd.community}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Assigned BA", true)}
                {isEditing ? <select className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500 bg-white" value={formData.ba} onChange={e => setFormData({...formData, ba: e.target.value})}><option value="">Select BA...</option>{(Array.isArray(bas) ? bas : []).filter(b => b.status === 'Active' || b.name === brd.ba).map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</select> : <div className="text-sm font-medium text-gray-900">{brd.ba}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Classification", true)}
                {isEditing ? <select className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500 bg-white" value={formData.classification} onChange={e => setFormData({...formData, classification: e.target.value})}><option value="">Select Classification...</option><option value="CRF">CRF</option><option value="New Project">New Project</option></select> : <div className="text-sm font-medium text-gray-900">{brd.classification || '-'}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Standard?", true)}
                {isEditing ? <div className="flex gap-6 pt-1"><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="editIsStandard" value="Yes" checked={formData.isStandard === 'Yes'} onChange={e => setFormData({...formData, isStandard: e.target.value})} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/> Yes</label><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="editIsStandard" value="No" checked={formData.isStandard === 'No'} onChange={e => setFormData({...formData, isStandard: e.target.value})} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/> No</label></div> : <div className="text-sm font-medium text-gray-900">{brd.isStandard || '-'}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Document Location (Link)", false)}
                {isEditing ? <input type="url" placeholder="https://..." className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500" value={formData.documentLink} onChange={e => setFormData({...formData, documentLink: e.target.value})} /> : <div className="text-sm font-medium text-gray-900 truncate pr-2">{brd.documentLink ? <a href={brd.documentLink} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline flex items-center gap-1">Open Document <ExternalLink size={14} /></a> : '-'}</div>}
              </div>

              <div className="col-span-1 md:col-span-2 lg:col-span-3 border-t border-gray-100 my-2"></div>

              <div className="space-y-1">
                {renderLabel("Draft Date", isDraftReq)}
                {isEditing ? <input type="date" className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500" value={formData.draftDate} onChange={e => setFormData({...formData, draftDate: e.target.value})} /> : <div className="text-sm font-medium text-gray-900">{brd.draftDate || '-'}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Date Submitted to Client", isClientReq)}
                {isEditing ? <input type="date" className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500" value={formData.clientSubmitDate} onChange={e => setFormData({...formData, clientSubmitDate: e.target.value})} /> : <div className="text-sm font-medium text-gray-900">{brd.clientSubmitDate || '-'}</div>}
              </div>
              <div className="space-y-1">
                {renderLabel("Signed-Off Date", isSignReq)}
                {isEditing ? <input type="date" className="w-full p-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500" value={formData.signOffDate} onChange={e => setFormData({...formData, signOffDate: e.target.value})} /> : <div className="text-sm font-medium text-gray-900">{brd.signOffDate || '-'}</div>}
              </div>
            </div>

            <div className="mt-8 pt-6 border-t border-gray-200">
              <div className="border border-gray-200 bg-gray-50/50 rounded-lg p-5">
                <h3 className="text-sm font-semibold text-gray-900 mb-5 flex items-center gap-2"><Clock size={16} className="text-blue-600"/> Cycle Time & Durations</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Preparation Days</label><div className="text-lg font-bold text-gray-900">{calculateDays(formData.draftDate, formData.clientSubmitDate)}</div></div>
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Client Review & Sign-Off</label><div className="text-lg font-bold text-gray-900">{calculateDays(formData.clientSubmitDate, formData.signOffDate)}</div></div>
                  <div><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">End-to-End Sign-off Cycle</label><div className="text-lg font-bold text-gray-900">{calculateDays(formData.draftDate, formData.signOffDate)}</div></div>
                </div>
              </div>
            </div>

            <div className="mt-8 pt-6 border-t border-gray-200">
              <div className="border border-gray-200 rounded-lg p-5">
                <h3 className="text-sm font-semibold text-gray-900 mb-5">Quality & Delivery Metrics</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">WITH REWORK? {isEditing && isReworkReq && <span className="text-red-500">*</span>}</label>
                    {isEditing ? <div className="flex gap-6"><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="withRework" value="Yes" checked={formData.withRework === 'Yes'} onChange={e => setFormData({...formData, withRework: e.target.value})} className="w-4 h-4 text-blue-600"/> Yes</label><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="withRework" value="No" checked={formData.withRework === 'No'} onChange={e => setFormData({...formData, withRework: e.target.value})} className="w-4 h-4 text-blue-600"/> No</label></div> : <div className="text-sm font-medium text-gray-900">{brd.withRework || '-'}</div>}
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">CHANGES AFTER SIGN-OFF? {isEditing && isChangesReq && <span className="text-red-500">*</span>}</label>
                    {isEditing ? <div className="flex gap-6"><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="changesAfterSignOff" value="Yes" checked={formData.changesAfterSignOff === 'Yes'} onChange={e => setFormData({...formData, changesAfterSignOff: e.target.value})} className="w-4 h-4 text-blue-600"/> Yes</label><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="changesAfterSignOff" value="No" checked={formData.changesAfterSignOff === 'No'} onChange={e => setFormData({...formData, changesAfterSignOff: e.target.value})} className="w-4 h-4 text-blue-600"/> No</label></div> : <div className="text-sm font-medium text-gray-900">{brd.changesAfterSignOff || '-'}</div>}
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">DELIVERED ON-TIME? {isEditing && isOnTimeReq && <span className="text-red-500">*</span>}</label>
                    {isEditing ? <div className="flex gap-6"><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="onTime" value="Yes" checked={formData.onTime === 'Yes'} onChange={e => setFormData({...formData, onTime: e.target.value})} className="w-4 h-4 text-blue-600"/> Yes</label><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input type="radio" name="onTime" value="No" checked={formData.onTime === 'No'} onChange={e => setFormData({...formData, onTime: e.target.value})} className="w-4 h-4 text-blue-600"/> No</label></div> : <div className="text-sm font-medium text-gray-900">{brd.onTime || '-'}</div>}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="flex border-b border-gray-200 bg-gray-50">
              <button className={`flex-1 py-3 text-sm font-semibold flex items-center justify-center gap-2 transition-colors ${activeTab === 'stage' ? 'text-blue-600 bg-white border-t-2 border-t-blue-600' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'}`} onClick={() => setActiveTab('stage')}><Clock size={16}/> Stage History</button>
              <button className={`flex-1 py-3 text-sm font-semibold flex items-center justify-center gap-2 transition-colors ${activeTab === 'activity' ? 'text-blue-600 bg-white border-t-2 border-t-blue-600' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'}`} onClick={() => setActiveTab('activity')}><Activity size={16}/> Activity History</button>
            </div>
            <div className="p-0 overflow-x-auto max-h-80 overflow-y-auto">
              {activeTab === 'stage' && (
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-white sticky top-0 border-b border-gray-200 shadow-sm text-gray-500"><tr><th className="px-4 py-3 font-medium">Date & Time</th><th className="px-4 py-3 font-medium">From Stage</th><th className="px-4 py-3 font-medium">To Stage</th><th className="px-4 py-3 font-medium">Updated By</th><th className="px-4 py-3 font-medium">Remarks</th></tr></thead>
                  <tbody className="divide-y divide-gray-100">
                    {(Array.isArray(brd.history) ? brd.history : []).map(h => <tr key={h.id} className="hover:bg-gray-50"><td className="px-4 py-3 text-gray-500">{h.date}</td><td className="px-4 py-3 font-medium text-gray-600">{h.from}</td><td className="px-4 py-3 font-medium text-blue-600">{h.to}</td><td className="px-4 py-3 text-gray-700">{h.by}</td><td className="px-4 py-3 text-gray-500 truncate max-w-[200px]" title={h.remarks}>{h.remarks}</td></tr>)}
                    {(!brd.history || brd.history.length === 0) && <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-400">No stage history available.</td></tr>}
                  </tbody>
                </table>
              )}
              {activeTab === 'activity' && (
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-white sticky top-0 border-b border-gray-200 shadow-sm text-gray-500"><tr><th className="px-4 py-3 font-medium">Date & Time</th><th className="px-4 py-3 font-medium">User</th><th className="px-4 py-3 font-medium">Activity</th><th className="px-4 py-3 font-medium">Previous Value</th><th className="px-4 py-3 font-medium">New Value</th></tr></thead>
                  <tbody className="divide-y divide-gray-100">
                    {(Array.isArray(brd.activityLog) ? brd.activityLog : []).map(h => <tr key={h.id} className="hover:bg-gray-50"><td className="px-4 py-3 text-gray-500">{h.date}</td><td className="px-4 py-3 font-medium text-gray-700">{h.user}</td><td className="px-4 py-3 text-gray-700">{h.action}</td><td className="px-4 py-3 text-red-500 line-through decoration-red-300">{h.prev}</td><td className="px-4 py-3 text-emerald-600 font-medium">{h.new}</td></tr>)}
                    {(!brd.activityLog || brd.activityLog.length === 0) && <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-400">No activity history available.</td></tr>}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          {showStageModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
