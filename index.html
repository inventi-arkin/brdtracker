    function ImportModule({ onImport, brds, onPurge }) {
      const [file, setFile] = useState(null);
      const [status, setStatus] = useState('');
      const [isImporting, setIsImporting] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);

      const handleFileChange = (e) => { if (e.target.files && e.target.files[0]) { setFile(e.target.files[0]); setStatus(''); } };

      const handlePurge = async () => {
        if (!confirmDelete) {
          setConfirmDelete(true);
          setTimeout(() => setConfirmDelete(false), 5000); 
          return;
        }
        
        setConfirmDelete(false);
        setIsImporting(true); 
        setStatus('Hard-deleting ALL records from the database. Please wait...');
        try {
          await onPurge();
          setStatus('Success: All BRD records have been completely hard-deleted from the database.');
          setFile(null);
        } catch(err) { 
          setStatus(`Error deleting records: ${err.message}`); 
        } finally { 
          setIsImporting(false); 
        }
      };

      const handleImport = async () => {
        if (!file) return;
        setIsImporting(true); setStatus('Loading Excel parser...');

        const processFile = () => {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const json = window.XLSX.utils.sheet_to_json(worksheet, { raw: false });
              
              if (json.length === 0) { setStatus('Error: The uploaded Excel file is empty.'); setIsImporting(false); return; }
              setStatus(`Processing ${json.length} records...`);
              
              const processedRecords = json.map((row, index) => {
                const draftD = String(row.draftDate || '');
                const submitD = String(row.clientSubmitDate || row.clientSubmittedDate || '');
                const signOffD = String(row.signOffDate || '');
                const stage = String(row.stage || 'Backlog');
                const generatedId = String(row.id || Date.now() + index + Math.random());
                const baName = String(row.ba || 'System Importer');
                const updatedDate = String(row.lastUpdated || new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }));
                
                let history = [];
                if (draftD) { history.push({ id: String(Date.now() + Math.random()), date: draftD, from: 'Backlog', to: 'BRD Creation', by: baName, remarks: 'Imported Draft Date' }); }
                if (submitD) { history.push({ id: String(Date.now() + Math.random()), date: submitD, from: 'Team Review', to: 'Client Review', by: baName, remarks: 'Imported Client Submit Date' }); }
                if (signOffD) { history.push({ id: String(Date.now() + Math.random()), date: signOffD, from: 'Client Review', to: 'Approved', by: baName, remarks: 'Imported Sign-Off Date' }); }
                
                history.push({
                  id: String(Date.now() + index + Math.random()),
                  date: updatedDate,
                  from: 'System Import',
                  to: stage,
                  by: baName,
                  remarks: `Record imported at stage: ${stage}`
                });

                history.sort((a, b) => new Date(b.date) - new Date(a.date));

                const activityLog = [{
                  id: String(Date.now() + index + Math.random()),
                  date: updatedDate,
                  user: baName,
                  action: 'Record Imported',
                  prev: '-',
                  new: `Stage: ${stage}`
                }];

                return {
                  id: generatedId,
                  title: String(row.title || 'Untitled'),
                  description: String(row.description || ''),
                  community: String(row.community || ''),
                  ba: baName,
                  classification: String(row.classification || ''),
                  isStandard: String(row.isStandard || ''),
                  documentLink: String(row.documentLink || ''),
                  stage: stage,
                  draftDate: draftD,
                  clientSubmitDate: submitD,
                  signOffDate: signOffD,
                  withRework: String(row.withRework || ''),
                  changesAfterSignOff: String(row.changesAfterSignOff || ''),
                  onTime: String(row.onTime || ''),
                  status: String(row.status || 'Active'),
                  lastUpdated: updatedDate,
                  history: history,
                  activityLog: activityLog
                };
              });

              onImport(processedRecords);
              setStatus(`Import Complete! Successfully added/updated ${processedRecords.length} records.`);
              setFile(null);
            } catch (err) { setStatus(`Error parsing file: ${err.message}`); } finally { setIsImporting(false); }
          };
          reader.readAsArrayBuffer(file);
        };

        if (window.XLSX) processFile();
        else {
          const script = document.createElement('script');
          script.src = 'https://unpkg.com/xlsx/dist/xlsx.full.min.js';
          script.onload = processFile;
          script.onerror = () => { setStatus('Error: Failed to load Excel parser library. Please check your internet connection.'); setIsImporting(false); };
          document.body.appendChild(script);
        }
      };

      return (
        <div className="p-4 md:p-6 max-w-4xl mx-auto space-y-6 animate-in fade-in duration-500">
          <div><h1 className="text-2xl font-bold text-gray-900">Import BRDs</h1><p className="text-gray-500 text-sm mt-1">Upload an Excel file to bulk import or update BRD records.</p></div>
          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 hover:bg-gray-100 transition-colors">
              <Upload className="mx-auto h-12 w-12 text-gray-400 mb-4" />
              <h3 className="text-lg font-medium text-gray-900 mb-2">Drag and drop your Excel file here</h3>
              <p className="text-sm text-gray-500 mb-6">or click to browse from your computer (.xlsx, .xls)</p>
              <input type="file" id="excel-upload" accept=".xlsx, .xls" className="hidden" onChange={handleFileChange} />
              <label htmlFor="excel-upload" className="cursor-pointer inline-flex items-center px-5 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shadow-sm"><Upload size={18} className="mr-2"/> Select Excel File</label>
              {file && <div className="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-lg inline-block text-blue-700 text-sm font-medium">Selected: {file.name}</div>}
            </div>
            <div className="mt-6 flex justify-end gap-3">
              <button onClick={handlePurge} disabled={isImporting} className={`px-6 py-2.5 text-white text-sm font-medium rounded-lg disabled:opacity-50 transition-colors shadow-sm ${confirmDelete ? 'bg-red-800 animate-pulse' : 'bg-red-600 hover:bg-red-700'}`}>
                {isImporting ? 'Processing...' : confirmDelete ? 'Click again to confirm!' : 'Delete All Data'}
              </button>
              <button onClick={handleImport} disabled={!file || isImporting} className="px-6 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 disabled:opacity-50 transition-colors shadow-sm">
                {isImporting ? 'Processing...' : 'Run Import'}
              </button>
            </div>
            {status && <div className={`mt-6 p-4 text-sm rounded-lg border ${status.includes('Error') ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>{status}</div>}
            <div className="mt-8 bg-amber-50 p-5 rounded-xl border border-amber-200">
               <h4 className="text-sm font-bold text-amber-800 flex items-center mb-3"><AlertCircle size={18} className="mr-2"/> Format Requirements</h4>
               <p className="text-sm text-amber-700 mb-3">Ensure your Excel file has headers in the first row. The system expects exactly these column headers:</p>
               <div className="flex flex-wrap gap-2 mt-2">
                 {['id', 'title', 'description', 'community', 'ba', 'classification', 'isStandard', 'documentLink', 'stage', 'draftDate', 'clientSubmitDate', 'signOffDate', 'withRework', 'changesAfterSignOff', 'onTime', 'status', 'lastUpdated'].map(col => <code key={col} className="bg-white border border-amber-200 text-amber-900 px-2 py-1 rounded text-xs font-mono shadow-sm">{col}</code>)}
               </div>
            </div>
          </div>
        </div>
      );
    }

              <div className="mx-auto bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mb-4 backdrop-blur-sm"><Lock size={32} className="text-white" /></div>
              <h2 className="text-2xl font-bold text-white">BRD Tracker</h2>

              {error && <div className="mb-6 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center"><AlertCircle size={16} className="mr-2 shrink-0" /> {error}</div>}
              <form onSubmit={handleSubmit} className="space-y-5">
                <div><label className="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label><input type="email" required className="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" value={email} onChange={e => setEmail(e.target.value)} /></div>
                <div><label className="block text-sm font-semibold text-gray-700 mb-1.5">Password</label><input type="password" required className="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" value={password} onChange={e => setPassword(e.target.value)} /></div>
                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 shadow-md mt-2">Sign In</button>
              </form>
              <div className="mt-6 text-center text-xs text-gray-500"><p>Demo Credentials:</p><p className="mt-1 font-mono bg-gray-100 inline-block px-2 py-1 rounded">admin@brdtracker.com / password</p></div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      
      const [users, setUsers] = useState(INITIAL_USERS);
      const [brds, setBrds] = useState([]);
      const [bas, setBas] = useState([]);
      const [accounts, setAccounts] = useState([]);
      
      const [activeModule, setActiveModule] = useState('dashboard');
      const [selectedBrd, setSelectedBrd] = useState(null);
      
      // Lifted Filter States
      const [kpiFilter, setKpiFilter] = useState(null);
      const [sourceView, setSourceView] = useState('brds');
      const [reportMonth, setReportMonth] = useState('September');
      const [reportYear, setReportYear] = useState('2026');

      const [showNewBrdModal, setShowNewBrdModal] = useState(false);
      const [newBrdData, setNewBrdData] = useState({ title: '', description: '', community: '', ba: '', classification: '', isStandard: '', documentLink: '' });
      const [masterModal, setMasterModal] = useState({ isOpen: false, type: '', mode: '', data: null });
      const [masterInput, setMasterInput] = useState('');
      const [masterError, setMasterError] = useState('');
      const [confirmToggleModal, setConfirmToggleModal] = useState({ isOpen: false, type: '', item: null });

      const [isLoading, setIsLoading] = useState(true);
      const [isLocalMode, setIsLocalMode] = useState(!firebaseConfig);
      const [dbUser, setDbUser] = useState(null);

      useEffect(() => {
        if (isLocalMode) { setIsLoading(false); return; }
        const initAuth = async () => {
          try {
            const isUsingSandbox = appId === 'default-app-id';
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && isUsingSandbox) {
              await window.FB.signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await window.FB.signInAnonymously(auth);
            }
          } catch (err) { 
            console.error("Firebase Auth Error:", err);
            try { await window.FB.signInAnonymously(auth); } catch(fallbackErr) { console.error("Fallback Auth Error:", fallbackErr); }
          }
        };
        initAuth();

        const unsubscribeAuth = window.FB.onAuthStateChanged(auth, (user) => { setDbUser(user); });
        return () => unsubscribeAuth();
      }, [isLocalMode]);

      useEffect(() => {
        if (isLocalMode || !dbUser || !db) return;

        const brdsRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'BRDs');
        const unsubscribeBrds = window.FB.onSnapshot(brdsRef, (snapshot) => {
          const fetchedBrds = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setBrds(fetchedBrds);
          setIsLoading(false);
        }, (error) => { 
          console.error("Error fetching BRDs:", error); 
          setIsLoading(false); 
        });

        const usersRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'Users');
        const unsubscribeUsers = window.FB.onSnapshot(usersRef, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          if (data.length > 0) setUsers(data);
        }, console.error);

        const basRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'BAs');
        const unsubscribeBas = window.FB.onSnapshot(basRef, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setBas(data);
        }, console.error);

        const accountsRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'Accounts');
        const unsubscribeAccounts = window.FB.onSnapshot(accountsRef, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setAccounts(data);
        }, console.error);

        return () => { unsubscribeBrds(); unsubscribeUsers(); unsubscribeBas(); unsubscribeAccounts(); };
      }, [isLocalMode, dbUser]);

      const syncBrdToDatabase = async (brdData) => {
        if (isLocalMode || !dbUser || !db) return;
        try {
          const docRef = window.FB.doc(db, 'artifacts', appId, 'public', 'data', 'BRDs', String(brdData.id));
          await window.FB.setDoc(docRef, brdData);
        } catch (err) { console.error("Error saving BRD to Firebase:", err); }
      };

      const syncMasterToDatabase = async (collectionName, masterData) => {
        if (isLocalMode || !dbUser || !db) return;
        try {
          const docRef = window.FB.doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(masterData.id));
          await window.FB.setDoc(docRef, masterData);
        } catch (err) { console.error(`Error saving ${collectionName} to Firebase:`, err); }
      };

      const handleLogin = (email, password) => {
        const user = users.find(u => u.email === email && u.password === password);
        if (user && user.status === 'Active') {
          setCurrentUser(user); setIsAuthenticated(true); return { success: true };
        }
        return { success: false, message: 'Invalid credentials or inactive account.' };
      };

      const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(null); setActiveModule('dashboard'); setKpiFilter(null); setSourceView('brds'); };
      const handleNav = (module) => { setActiveModule(module); setSelectedBrd(null); setKpiFilter(null); setSourceView('brds'); };

      const handleUpdateBrd = (updatedBrd) => {
        setBrds(prev => prev.map(b => String(b.id) === String(updatedBrd.id) ? updatedBrd : b));
        setSelectedBrd(updatedBrd);
        syncBrdToDatabase(updatedBrd);
      };

      const handleBulkImport = (newRecords) => {
        const existingIds = new Set(brds.map(b => String(b.id)));
        const recordsToAdd = newRecords.filter(r => !existingIds.has(String(r.id)));
        const recordsToUpdate = newRecords.filter(r => existingIds.has(String(r.id)));
        
        let updatedBrds = [...brds];
        recordsToUpdate.forEach(record => {
            const index = updatedBrds.findIndex(b => String(b.id) === String(record.id));
            if (index !== -1) updatedBrds[index] = { ...updatedBrds[index], ...record };
        });
        updatedBrds = [...recordsToAdd, ...updatedBrds];
        setBrds(updatedBrds);
        
        newRecords.forEach(record => syncBrdToDatabase(record));
      };

      const handlePurgeAllData = async () => {
        if (isLocalMode) { setBrds([]); return true; }
        try {
          const deleteDocFn = window.FB.deleteDoc;
          const getDocsFn = window.FB.getDocs;
          if (!db || !deleteDocFn || !getDocsFn) throw new Error("Firebase database connection is not ready or deletion tools are missing.");
          const collectionRef = window.FB.collection(db, 'artifacts', appId, 'public', 'data', 'BRDs');
          const snapshot = await getDocsFn(collectionRef);
          setBrds([]); 
          for (const docSnap of snapshot.docs) {
            try { await deleteDocFn(docSnap.ref); } catch (e) { console.error("Failed to delete record:", docSnap.id, e); }
          }
          return true;
        } catch (err) { throw err; }
      };

      const handleCreateNewBrd = (e) => {
        e.preventDefault();
        const newId = String(brds.length > 0 ? Math.max(...brds.map(b => parseInt(b.id, 10) || 0)) + 1 : 1);
        const timestamp = new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
        const userName = currentUser ? `${currentUser.firstName} ${currentUser.lastName}` : 'System User';
        
        const newBrd = {
          id: newId, title: newBrdData.title, description: newBrdData.description,
          community: newBrdData.community, ba: newBrdData.ba, classification: newBrdData.classification,
          isStandard: newBrdData.isStandard, documentLink: newBrdData.documentLink, stage: 'Backlog', status: 'Active',
          draftDate: '', clientSubmitDate: '', signOffDate: '', withRework: '', changesAfterSignOff: '', onTime: '',
          lastUpdated: timestamp,
          history: [{ id: String(Date.now()), brdId: newId, date: timestamp, from: '-', to: 'Backlog', by: userName, remarks: 'Record created' }],
          activityLog: [{ id: String(Date.now() + 1), brdId: newId, date: timestamp, user: userName, action: 'Record Created', prev: '-', new: 'Initial Setup' }]
        };

        if (isLocalMode) setBrds(prev => [newBrd, ...prev]);
        setShowNewBrdModal(false);
        setNewBrdData({ title: '', description: '', community: '', ba: '', classification: '', isStandard: '', documentLink: '' });
        setSelectedBrd(newBrd);
        syncBrdToDatabase(newBrd);
      };

      const openMasterModal = (type, mode, item = null) => {
        setMasterInput(item ? item.name : '');
        setMasterError('');
        setMasterModal({ isOpen: true, type, mode, data: item });
      };

      const handleSaveMasterData = (e) => {
        e.preventDefault();
        const trimmedInput = masterInput.trim();
        if (!trimmedInput) return;
        
        const collectionName = masterModal.type === 'BA' ? 'BAs' : 'Accounts';
        const listToCheck = masterModal.type === 'BA' ? bas : accounts;
        
        const isDuplicate = listToCheck.some(item => 
          item.name.toLowerCase() === trimmedInput.toLowerCase() && 
          (masterModal.mode === 'Add' || String(item.id) !== String(masterModal.data.id))
        );

        if (isDuplicate) {
          setMasterError(`A${masterModal.type === 'Account' ? 'n Account' : ' BA'} with the name "${trimmedInput}" already exists.`);
          return;
        }

        const timestamp = new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });

        let updatedItem;
        if (masterModal.mode === 'Add') updatedItem = { id: String(Date.now()), name: trimmedInput, status: 'Active', lastUpdated: timestamp };
        else updatedItem = { ...masterModal.data, name: trimmedInput, lastUpdated: timestamp };
        
        if (isLocalMode) {
          const setList = masterModal.type === 'BA' ? setBas : setAccounts;
          const list = masterModal.type === 'BA' ? bas : accounts;
          if (masterModal.mode === 'Add') setList([...list, updatedItem]);
          else setList(list.map(i => i.id === masterModal.data.id ? updatedItem : i));
        }
        
        setMasterModal({ isOpen: false, type: '', mode: '', data: null });
        setMasterError('');
        syncMasterToDatabase(collectionName, updatedItem);
      };

      const confirmToggleStatus = () => {
        const timestamp = new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
        const newStatus = confirmToggleModal.item.status === 'Active' ? 'Inactive' : 'Active';
        const updatedItem = { ...confirmToggleModal.item, status: newStatus, lastUpdated: timestamp };

        if (confirmToggleModal.type === 'BRD') {
          setBrds(brds.map(b => String(b.id) === String(updatedItem.id) ? updatedItem : b));
          syncBrdToDatabase(updatedItem);
        } else {
          const collectionName = confirmToggleModal.type === 'BA' ? 'BAs' : 'Accounts';
          const setList = confirmToggleModal.type === 'BA' ? setBas : setAccounts;
          const list = confirmToggleModal.type === 'BA' ? bas : accounts;
          setList(list.map(i => String(i.id) === String(updatedItem.id) ? updatedItem : i));
          syncMasterToDatabase(collectionName, updatedItem);
        }
        
        setConfirmToggleModal({ isOpen: false, type: '', item: null });
      };

      const handleSetUsers = (newUsersArray) => {
        if (isLocalMode) setUsers(newUsersArray);
        const updatedUser = newUsersArray.reduce((latest, current) => new Date(current.lastUpdated) > new Date(latest.lastUpdated) ? current : latest, newUsersArray[0]);
        if (updatedUser) syncMasterToDatabase('Users', updatedUser);
      };

      //      if (isLoading) return <div className="flex h-screen items-center justify-center bg-slate-900 text-white flex-col gap-4"><RefreshCw size={40} className="animate-spin text-blue-500" /><h2 className="text-xl font-semibold">Connecting to Database...</h2></div>;
      if (!isAuthenticated) return <LoginPage onLogin={handleLogin} />;

      return (
        <div className="flex h-screen bg-gray-100 font-sans text-gray-900 overflow-hidden">
          <aside className="w-20 md:w-64 bg-slate-900 text-white flex flex-col shrink-0 transition-all z-20 shadow-xl">
            <div className="h-16 flex items-center justify-center md:justify-start px-0 md:px-6 border-b border-slate-800 shrink-0"><div className="bg-blue-600 p-1.5 rounded-md md:mr-3"><FileText size={18} className="text-white"/></div><span className="font-bold tracking-wide hidden md:block">BRD Tracker</span></div>
            <nav className="flex-1 py-6 px-3 space-y-2 overflow-y-auto">
              <button onClick={() => handleNav('dashboard')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'dashboard' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><LayoutDashboard size={20} className="md:mr-3" /> <span className="hidden md:block">Dashboard</span></button>
              <button onClick={() => handleNav('brds')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'brds' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><FileText size={20} className="md:mr-3" /> <span className="hidden md:block">BRDs</span></button>
              <button onClick={() => handleNav('bas')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'bas' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><Users size={20} className="md:mr-3" /> <span className="hidden md:block">BAs</span></button>
              <button onClick={() => handleNav('accounts')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'accounts' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><Building2 size={20} className="md:mr-3" /> <span className="hidden md:block">Accounts</span></button>
              <button onClick={() => handleNav('reports')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'reports' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><BarChart2 size={20} className="md:mr-3" /> <span className="hidden md:block">Reports</span></button>
              {currentUser?.email === 'admin@brdtracker.com' && (
                <button onClick={() => handleNav('users')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'users' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}><UserCog size={20} className="md:mr-3" /> <span className="hidden md:block">Users</span></button>
              )}
              {currentUser?.email === 'admin@brdtracker.com' && (
                <div className="mt-8 border-t border-slate-700 pt-4"><button onClick={() => handleNav('import')} className={`w-full flex items-center justify-center md:justify-start px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeModule === 'import' ? 'bg-emerald-600 text-white shadow-sm' : 'text-emerald-500 hover:bg-slate-800 hover:text-emerald-400'}`}><FileUp size={20} className="md:mr-3" /> <span className="hidden md:block">Import BRDs</span></button></div>
              )}
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-6 shrink-0 z-10 border-b border-gray-200">
              <div className="flex items-center">{isLocalMode && <span className="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-200 flex items-center shadow-sm"><AlertCircle size={14} className="mr-1.5"/> Local Demo Mode</span>}</div>
              <div className="flex items-center space-x-4 text-sm"><span className="text-gray-500 hidden md:inline-block">Logged in as: <strong className="text-gray-900">{currentUser.firstName} {currentUser.lastName}</strong></span><div className="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold border border-blue-200">{currentUser.firstName[0]}{currentUser.lastName[0]}</div><button onClick={handleLogout} className="text-gray-400 hover:text-gray-700 ml-4 p-1" title="Logout"><LogOut size={18} /></button></div>
            </header>

            <main className="flex-1 overflow-y-auto bg-gray-50">
              {activeModule === 'dashboard' && (
                <Dashboard 
                  brds={brds} 
                  onKpiClick={(title, ids) => { setKpiFilter({title, ids}); setActiveModule('brds'); }} 
                  onViewBrd={(brd) => { setSourceView('dashboard'); setSelectedBrd(brd); setActiveModule('brds'); }} 
                />
              )}
              {activeModule === 'brds' && !selectedBrd && (
                <BrdList 
                  brds={brds} 
                  onView={(brd) => { setSourceView('brds'); setSelectedBrd(brd); }} 
                  onAdd={() => setShowNewBrdModal(true)} 
                  onToggleStatus={(item) => setConfirmToggleModal({ isOpen: true, type: 'BRD', item })} 
                  accounts={accounts} 
                  bas={bas} 
                  kpiFilter={kpiFilter} 
                  onClearKpiFilter={() => setKpiFilter(null)} 
                  onBackToDashboard={() => { setKpiFilter(null); setActiveModule('dashboard'); }} 
                />
              )}
              {activeModule === 'brds' && selectedBrd && (
                <BrdDetail 
                  brd={selectedBrd} 
                  backLabel={sourceView === 'dashboard' ? 'Back to Dashboard' : sourceView === 'reports' ? 'Back to Reports' : 'Back to List'} 
                  onBack={() => { setSelectedBrd(null); if (sourceView === 'dashboard') setActiveModule('dashboard'); else if (sourceView === 'reports') setActiveModule('reports'); }} 
                  onUpdate={handleUpdateBrd} 
                  accounts={accounts} 
                  bas={bas} 
                  currentUser={currentUser} 
                />
              )}
              {activeModule === 'bas' && <MasterList title="Business Analysts" noun="BA" data={bas} onAdd={() => openMasterModal('BA', 'Add')} onEdit={(item) => openMasterModal('BA', 'Edit', item)} onToggleStatus={(item) => setConfirmToggleModal({ isOpen: true, type: 'BA', item })} />}
              {activeModule === 'accounts' && <MasterList title="Accounts" noun="Account" data={accounts} onAdd={() => openMasterModal('Account', 'Add')} onEdit={(item) => openMasterModal('Account', 'Edit', item)} onToggleStatus={(item) => setConfirmToggleModal({ isOpen: true, type: 'Account', item })} />}
              {activeModule === 'reports' && <ReportsModule brds={brds} onViewBrd={(brd) => { setSourceView('reports'); setSelectedBrd(brd); setActiveModule('brds'); }} filterMonth={reportMonth} setFilterMonth={setReportMonth} filterYear={reportYear} setFilterYear={setReportYear} />}
              {activeModule === 'users' && <UserList users={users} setUsers={handleSetUsers} />}
              {activeModule === 'import' && <ImportModule onImport={handleBulkImport} brds={brds} onPurge={handlePurgeAllData} />}
            </main>
          </div>

          {/* */}
          {showNewBrdModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-md flex flex-col max-h-[90vh] animate-in fade-in">
                <div className="flex justify-between items-center p-6 border-b border-gray-100 shrink-0"><h3 className="text-xl font-bold text-gray-900">Create New BRD</h3><button onClick={() => setShowNewBrdModal(false)} className="text-gray-400 hover:text-gray-600"><X size={20} /></button></div>
                <div className="overflow-y-auto p-6">
                  <form id="new-brd-form" onSubmit={handleCreateNewBrd} className="space-y-4">
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">BRD Title <span className="text-red-500">*</span></label><input required type="text" className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={newBrdData.title} onChange={(e) => setNewBrdData({...newBrdData, title: e.target.value})}/></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Description <span className="text-red-500">*</span></label><textarea required className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm resize-none" rows="3" value={newBrdData.description} onChange={(e) => setNewBrdData({...newBrdData, description: e.target.value})} /></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Account <span className="text-red-500">*</span></label><select required className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm" value={newBrdData.community} onChange={(e) => setNewBrdData({...newBrdData, community: e.target.value})}><option value="">Select Account</option>{(Array.isArray(accounts) ? accounts : []).filter(a => a.status === 'Active').map(a => <option key={a.id} value={a.name}>{a.name}</option>)}</select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Assigned BA <span className="text-red-500">*</span></label><select required className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm" value={newBrdData.ba} onChange={(e) => setNewBrdData({...newBrdData, ba: e.target.value})}><option value="">Select BA</option>{(Array.isArray(bas) ? bas : []).filter(b => b.status === 'Active').map(ba => <option key={ba.id} value={ba.name}>{ba.name}</option>)}</select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Classification <span className="text-red-500">*</span></label><select required className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm" value={newBrdData.classification} onChange={(e) => setNewBrdData({...newBrdData, classification: e.target.value})}><option value="">Select Classification</option><option value="CRF">CRF</option><option value="New Project">New Project</option></select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Standard? <span className="text-red-500">*</span></label><div className="flex gap-6 mt-2"><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input required type="radio" name="newIsStandard" value="Yes" checked={newBrdData.isStandard === 'Yes'} onChange={e => setNewBrdData({...newBrdData, isStandard: e.target.value})} className="w-4 h-4 text-blue-600"/> Yes</label><label className="flex items-center gap-2 cursor-pointer text-sm text-gray-700 font-medium"><input required type="radio" name="newIsStandard" value="No" checked={newBrdData.isStandard === 'No'} onChange={e => setNewBrdData({...newBrdData, isStandard: e.target.value})} className="w-4 h-4 text-blue-600"/> No</label></div></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Document Location (Link)</label><input type="url" className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={newBrdData.documentLink} onChange={(e) => setNewBrdData({...newBrdData, documentLink: e.target.value})}/></div>
                  </form>
                </div>
                <div className="p-6 border-t border-gray-100 flex justify-end gap-3 shrink-0"><button type="button" onClick={() => setShowNewBrdModal(false)} className="px-4 py-2 text-gray-600 text-sm font-medium hover:bg-gray-100 rounded-lg">Cancel</button><button type="submit" form="new-brd-form" className="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 shadow-sm">Create BRD</button></div>
              </div>
            </div>
          )}

          {masterModal.isOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 animate-in fade-in">
                <div className="flex justify-between items-center mb-5"><h3 className="text-lg font-bold text-gray-900">{masterModal.mode} {masterModal.type}</h3><button onClick={() => { setMasterModal({ isOpen: false, type: '', mode: '', data: null }); setMasterError(''); }} className="text-gray-400 hover:text-gray-600"><X size={20} /></button></div>
                {masterError && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center"><AlertCircle size={16} className="mr-2 shrink-0" /> {masterError}</div>}
                <form onSubmit={handleSaveMasterData} className="space-y-4">
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">{masterModal.type} Name <span className="text-red-500">*</span></label><input required type="text" autoFocus className="w-full p-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" value={masterInput} onChange={(e) => { setMasterInput(e.target.value); setMasterError(''); }} /></div>
                  <div className="pt-2 flex justify-end gap-3"><button type="button" onClick={() => { setMasterModal({ isOpen: false, type: '', mode: '', data: null }); setMasterError(''); }} className="px-4 py-2 text-sm text-gray-600 font-medium hover:bg-gray-100 rounded-lg">Cancel</button><button type="submit" className="px-4 py-2 text-sm bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 shadow-sm">Save</button></div>
                </form>
              </div>
            </div>
          )}

          {confirmToggleModal.isOpen && confirmToggleModal.item && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 animate-in fade-in">
                <div className="flex items-center gap-3 mb-4 text-amber-600"><AlertCircle size={24} /><h3 className="text-lg font-bold text-gray-900">Confirm Action</h3></div>
                <p className="text-gray-600 mb-6 text-sm">Are you sure you want to <strong>{confirmToggleModal.item.status === 'Active' ? 'deactivate' : 'activate'}</strong> the record for <strong className="text-gray-900">{confirmToggleModal.item.name || confirmToggleModal.item.title}</strong>?</p>
                <div className="flex justify-end gap-3"><button onClick={() => setConfirmToggleModal({ isOpen: false, type: '', item: null })} className="px-4 py-2 text-sm text-gray-600 font-medium hover:bg-gray-100 rounded-lg">Cancel</button><button onClick={confirmToggleStatus} className={`px-4 py-2 text-sm text-white font-medium rounded-lg shadow-sm ${confirmToggleModal.item.status === 'Active' ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}>Confirm</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
